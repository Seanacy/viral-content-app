function generateWithAI(selections, apiKey, onResult, onError) {
  var isPaid = PLATFORMS.find(function(p){return p.label===selections.platform;});
  isPaid = isPaid && isPaid.type === "paid";

  var sysPrompt = "You are a world-class viral content strategist and copywriter. Generate content based on the user's selections. Return ONLY valid JSON with this exact structure: {\"scripts\":[{\"title\":\"...\",\"content\":\"...\"},...],\"hooks\":[\"...\"],\"captions\":[\"...\"],\"adCopy\":\"...\",\"shotList\":\"...\"}. Generate 3 scripts, 5 hooks, 3 captions." + (isPaid ? " Include compelling ad copy with headline, primary text, and CTA." : " Set adCopy to empty string.") + " Make everything specific to their brand, niche, audience, and platform. Be creative, punchy, and viral-worthy. Match the tone they selected.";

  var userPrompt = "Brand: " + selections.brand +
    "\nNiche: " + selections.niche +
    "\nProduct: " + selections.product +
    "\nPlatform: " + selections.platform +
    "\nAudience: " + selections.audience +
    "\nGoal: " + selections.goal +
    "\nContent Format: " + selections.format +
    "\nHook Style: " + selections.hook +
    "\nTone: " + selections.tone +
    "\n\nGenerate viral content for this exact combination. Make the scripts detailed with stage directions and timing. Hooks should be under 2 seconds when spoken. Captions should include relevant hashtags.";

  fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer " + apiKey},
    body: JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"system",content:sysPrompt},{role:"user",content:userPrompt}],
      temperature:0.9,
      max_tokens:3000,
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){onError(data.error.message);return;}
    try{
      var content = data.choices[0].message.content;
      content = content.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();
      var parsed = JSON.parse(content);
      onResult(parsed);
    }catch(e){onError("Failed to parse AI response. Try again.");}
  })
  .catch(function(e){onError("Network error: " + e.message);});
}
