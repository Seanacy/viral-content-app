      display:"flex", alignItems:"center", gap:12, width:"100%", padding:"14px 16px",

      border: active ? "2px solid " + color : "2px solid #1e293b",
      borderRadius:14, cursor:"pointer", textAlign:"left", transition:"all 0.2s",
    }
  },
    h("span",{style:{fontSize:24,flexShrink:0}}, props.icon),
    h("div",{style:{flex:1,minWidth:0}},
      h("div",{style:{fontSize:15,fontWeight:600,color:active?"#e2e8f0":"#94a3b8"}}, props.label),
      props.desc && h("div",{style:{fontSize:12,color:"#64748b",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}, props.desc)
    ),
    active && h("span",{style:{fontSize:18,color:color,flexShrink:0}}, "✓")

}

function generateWithAI(sel, apiKey, onResult, onError) {
  var isImage = sel.mediaType === "picture";
  var isPaid = sel.contentType === "paid";
  var site = WEBSITES.find(function(w){return w.id===sel.website;});
  var siteName = site ? site.label : "Brand";
  var siteUrl = site ? site.url : "";

  var featureObj = sel.feature ? MODELBID_FEATURES.find(function(f){return f.id===sel.feature;}) : null;
  var featureStr = featureObj ? featureObj.label : "";
  var offerName = featureStr ? featureStr + " on " + siteName : siteName;

  // Pull product context if available
  var prodCtx = null;
  if (site && sel.feature && PRODUCT_CONTEXT[site.id] && PRODUCT_CONTEXT[site.id][sel.feature]) {
    prodCtx = PRODUCT_CONTEXT[site.id][sel.feature];
  }

  var sysPrompt = "You are a world-class viral content strategist. Generate content promoting " + offerName + " (" + siteUrl + "). IMPORTANT: The creator's goal is to '" + sel.goal + "' — this means the CONTENT should be designed so that VIEWERS take that action (e.g. if goal is 'Get DMs', make content that entices viewers to DM the creator about the offer — do NOT create content about teaching viewers how to get DMs). The content sells/promotes the creator's offer, and the goal describes what response the creator wants from viewers. Return ONLY valid JSON: {\"scripts\":[{\"title\":\"...\",\"content\":\"...\"},...],\"hooks\":[\"...\"],\"captions\":[\"...\"],\"adCopy\":\"...\",\"shotList\":\"...\"}. Generate 3 " + (isImage ? "image ad concepts (each with HEADLINE, BODY TEXT, CTA, VISUAL DESCRIPTION)" : "scripts with timing and stage directions") + ", 5 hooks, 3 captions." + (isPaid ? " Include compelling ad copy with headline, primary text, CTA." : " Set adCopy to empty string.") + (isImage ? " For shotList provide image composition guidance." : " For shotList provide shot-by-shot filming guide.") + " Match the tone: " + sel.tone + "." + (featureStr ? " Focus specifically on the " + featureStr + " feature — make the content about what makes " + featureStr + " valuable to the viewer." : "");

  var productContextStr = "";
  if (prodCtx) {
    productContextStr = "\n\n--- PRODUCT DETAILS ---" +
      "\nTagline: " + prodCtx.tagline +
      "\nHow It Works: " + prodCtx.howItWorks +
      "\nKey Benefits: " + prodCtx.benefits.join("; ") +
      "\nSelling Points: " + prodCtx.sellingPoints.join("; ") +
      "\n--- END PRODUCT DETAILS ---" +
      "\nUse the above product details to create content that accurately represents what " + featureStr + " actually is and why viewers should care.";
  }

  var userPrompt = "Website: " + siteName + " (" + siteUrl + ")" +
    (featureStr ? "\nFeature to Promote: " + featureStr + " — " + featureObj.desc : "") +
    productContextStr +
    "\nContent Type: " + (isPaid ? "Paid Ad" : "Organic Content") +
    "\nMedia: " + (isImage ? "Static Image" : "Video") +
    "\nPlatform: " + sel.platform +
    "\nCreator's Goal: " + sel.goal + " (this is what the creator wants viewers to do — NOT what the content teaches)" +
    "\nFormat: " + sel.format +
    "\nHook Style: " + sel.hook +
    "\nTone: " + sel.tone +
    (sel.infoBank ? "\n\nAdditional Context:\n" + sel.infoBank : "") +
    "\n\nGenerate viral content that promotes " + offerName + " and drives viewers to " + sel.goal.toLowerCase() + ". Be specific to this brand and platform.";

  fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer " + apiKey},
    body: JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"system",content:sysPrompt},{role:"user",content:userPrompt}],
      temperature:0.9,max_tokens:3000,
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){onError(data.error.message);return;}
    try{
      var content = data.choices[0].message.content;
      content = content.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();
      onResult(JSON.parse(content));
    }catch(e){onError("Failed to parse AI response. Try again.");}
  })
  .catch(function(e){onError("Network error: " + e.message);});
}

function generateFallback(sel) {
  var site = WEBSITES.find(function(w){return w.id===sel.website;});
  var brand = site ? site.label : "Your Brand";
  var featureObj = sel.feature ? MODELBID_FEATURES.find(function(f){return f.id===sel.feature;}) : null;
  var offer = featureObj ? featureObj.label + " on " + brand : brand;
  var isImage = sel.mediaType === "picture";
  var isPaid = sel.contentType === "paid";
  var goal = sel.goal || "engagement";
  var tone = sel.tone || "authentic";
  var format = sel.format || "content";

  // Goal-driven CTAs — what the creator wants viewers to DO
  var goalCTA = goal==="Get DMs" ? "DM me for details" : goal==="Drive Sales" ? "Tap the link to get started" : goal==="Get Follows" ? "Follow for more" : goal==="Get Clicks" ? "Link in bio" : goal==="Get Shares" ? "Tag someone who needs this" : goal==="Build Trust" ? "Follow for more real talk" : goal==="Get Signups" ? "Sign up — link in bio" : goal==="Stop the Scroll" ? "Save this for later" : "Check it out";

  var scripts = isImage ? [
    {title:"Image Concept A", content:"HEADLINE: \"" + offer + " — built different.\"\n\nBODY: The exclusive access you've been waiting for.\n\nCTA: \"" + goalCTA + "\"\n\nVISUAL: Clean product/brand shot, bold headline overlay, " + tone.toLowerCase() + " color palette"},
    {title:"Image Concept B", content:"HEADLINE: \"This changes everything.\"\n\nBODY: " + offer + " is giving creators a whole new level.\n\nCTA: \"" + goalCTA + "\"\n\nVISUAL: Lifestyle photo, minimal text, aspirational vibe"},
    {title:"Image Concept C", content:"HEADLINE: \"Don't sleep on " + offer + ".\"\n\nBODY: Thousands already joined. Now it's your turn.\n\nCTA: \"" + goalCTA + "\"\n\nVISUAL: Bold graphic with urgency element, eye-catching contrast"},
  ] : [
    {title:format + " — Option A", content:"HOOK (0-2s): \"Nobody talks about " + offer + "...\"\n\nBUILD (2-8s): Show what makes " + offer + " different. " + tone + " energy.\n\nPAYOFF (8-15s): Reveal the value — why viewers need to check it out now.\n\nCTA: \"" + goalCTA + "\""},
    {title:format + " — Option B", content:"HOOK (0-2s): \"POV: You just found out about " + offer + "\"\n\nBUILD (2-8s): Show the before — missing out. Build curiosity.\n\nPAYOFF (8-15s): The moment they see what " + offer + " offers. Genuine reaction.\n\nCTA: \"" + goalCTA + "\""},
    {title:format + " — Option C", content:"HOOK (0-2s): \"3 things about " + offer + " that will blow your mind\"\n\nPOINT 1 (2-5s): What makes it unique\n\nPOINT 2 (5-8s): Why " + offer + " is different from everything else\n\nPOINT 3 (8-12s): The result that speaks for itself\n\nCTA: \"" + goalCTA + "\""},
  ];

  return {
    scripts: scripts,
    hooks: [
      "Nobody's talking about " + offer + "...",
      "POV: You just discovered " + offer,
      "Stop scrolling — you need to see " + offer,
      "I wish I knew about " + offer + " sooner",
      "This is why everyone's joining " + offer,
    ],
    captions: [
      "This changed everything \u{1f631} #" + brand.replace(/\s/g,"") + " #viral #fyp",
      "Save this for later \u{1f516} #" + brand.replace(/\s/g,"") + " #gamechanger",
      "Tag someone who needs to see this \u{1f447} #" + brand.replace(/\s/g,"") + " #fyp",
    ],
    adCopy: isPaid ? "HEADLINE: " + offer + " — See What You're Missing\n\nPRIMARY TEXT: " + offer + " is giving people exclusive access like never before.\n\n\u{2713} Real results\n\u{2713} Trusted platform\n\u{2713} Join thousands\n\nCTA: " + goalCTA : "",
    shotList: isImage ?

function generateWithAI(sel, apiKey, onResult, onError) {
  var isImage = sel.mediaType === "picture";
  var isPaid = sel.contentType === "paid";
  var site = WEBSITES.find(function(w){return w.id===sel.website;});
  var siteName = site ? site.label : "Brand";
  var siteUrl = site ? site.url : "";

  var featureObj = sel.feature ? MODELBID_FEATURES.find(function(f){return f.id===sel.feature;}) : null;
  var featureStr = featureObj ? featureObj.label : "";
  var offerName = featureStr ? featureStr + " on " + siteName : siteName;

  // Pull product context if available
  var prodCtx = null;
  if (site && sel.feature && PRODUCT_CONTEXT[site.id] && PRODUCT_CONTEXT[site.id][sel.feature]) {
    prodCtx = PRODUCT_CONTEXT[site.id][sel.feature];
  }

  var sysPrompt = "You are a world-class viral content strategist. Generate content promoting " + offerName + " (" + siteUrl + "). IMPORTANT: The creator's goal is to '" + sel.goal + "' — this means the CONTENT should be designed so that VIEWERS take that action (e.g. if goal is 'Get DMs', make content that entices viewers to DM the creator about the offer — do NOT create content about teaching viewers how to get DMs). The content sells/promotes the creator's offer, and the goal describes what response the creator wants from viewers. Return ONLY valid JSON: {\"scripts\":[{\"title\":\"...\",\"content\":\"...\"},...],\"hooks\":[\"...\"],\"captions\":[\"...\"],\"adCopy\":\"...\",\"shotList\":\"...\"}. Generate 3 " + (isImage ? "image ad concepts (each with HEADLINE, BODY TEXT, CTA, VISUAL DESCRIPTION)" : "scripts with timing and stage directions") + ", 5 hooks, 3 captions." + (isPaid ? " Include compelling ad copy with headline, primary text, CTA." : " Set adCopy to empty string.") + (isImage ? " For shotList provide image composition guidance." : " For shotList provide shot-by-shot filming guide.") + " Match the tone: " + sel.tone + "." + (featureStr ? " Focus specifically on the " + featureStr + " feature — make the content about what makes " + featureStr + " valuable to the viewer." : "");

  var productContextStr = "";
  if (prodCtx) {
    productContextStr = "\n\n--- PRODUCT DETAILS ---" +
      "\nTagline: " + prodCtx.tagline +
      "\nHow It Works: " + prodCtx.howItWorks +
      "\nKey Benefits: " + prodCtx.benefits.join("; ") +
      "\nSelling Points: " + prodCtx.sellingPoints.join("; ") +
      "\n--- END PRODUCT DETAILS ---" +
      "\nUse the above product details to create content that accurately represents what " + featureStr + " actually is and why viewers should care.";
  }

  var userPrompt = "Website: " + siteName + " (" + siteUrl + ")" +
    (featureStr ? "\nFeature to Promote: " + featureStr + " — " + featureObj.desc : "") +
    productContextStr +
    "\nContent Type: " + (isPaid ? "Paid Ad" : "Organic Content") +
    "\nMedia: " + (isImage ? "Static Image" : "Video") +
    "\nPlatform: " + sel.platform +
    "\nCreator's Goal: " + sel.goal + " (this is what the creator wants viewers to do — NOT what the content teaches)" +
    "\nFormat: " + sel.format +
    "\nHook Style: " + sel.hook +
    "\nTone: " + sel.tone +
    (sel.infoBank ? "\n\nAdditional Context:\n" + sel.infoBank : "") +
    "\n\nGenerate viral content that promotes " + offerName + " and drives viewers to " + sel.goal.toLowerCase() + ". Be specific to this brand and platform.";

  fetch("https://api.openai.com/v1/chat/completions", {
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer " + apiKey},
    body: JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"system",content:sysPrompt},{role:"user",content:userPrompt}],
      temperature:0.9,max_tokens:3000,
    })
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.error){onError(data.error.message);return;}
    try{
      var content = data.choices[0].message.content;
      content = content.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();
      onResult(JSON.parse(content));
    }catch(e){onError("Failed to parse AI response. Try again.");}
  })
  .catch(function(e){onError("Network error: " + e.message);});
}

function generateFallback(sel) {
  var site = WEBSITES.find(function(w){return w.id===sel.website;});
  var brand = site ? site.label : "Your Brand";
  var featureObj = sel.feature ? MODELBID_FEATURES.find(function(f){return f.id===sel.feature;}) : null;
  var offer = featureObj ? featureObj.label + " on " + brand : brand;
  var isImage = sel.mediaType === "picture";
  var isPaid = sel.contentType === "paid";
  var goal = sel.goal || "engagement";
  var tone = sel.tone || "authentic";
  var format = sel.format || "content";

  // Goal-driven CTAs — what the creator wants viewers to DO
  var goalCTA = goal==="Get DMs" ? "DM me for details" : goal==="Drive Sales" ? "Tap the link to get started" : goal==="Get Follows" ? "Follow for more" : goal==="Get Clicks" ? "Link in bio" : goal==="Get Shares" ? "Tag someone who needs this" : goal==="Build Trust" ? "Follow for more real talk" : goal==="Get Signups" ? "Sign up — link in bio" : goal==="Stop the Scroll" ? "Save this for later" : "Check it out";

  var scripts = isImage ? [
    {title:"Image Concept A", content:"HEADLINE: \"" + offer + " — built different.\"\n\nBODY: The exclusive access you've been waiting for.\n\nCTA: \"" + goalCTA + "\"\n\nVISUAL: Clean product/brand shot, bold headline overlay, " + tone.toLowerCase() + " color palette"},
    {title:"Image Concept B", content:"HEADLINE: \"This changes everything.\"\n\nBODY: " + offer + " is giving creators a whole new level.\n\nCTA: \"" + goalCTA + "\"\n\nVISUAL: Lifestyle photo, minimal text, aspirational vibe"},
    {title:"Image Concept C", content:"HEADLINE: \"Don't sleep on " + offer + ".\"\n\nBODY: Thousands already joined. Now it's your turn.\n\nCTA: \"" + goalCTA + "\"\n\nVISUAL: Bold graphic with urgency element, eye-catching contrast"},
  ] : [
    {title:format + " — Option A", content:"HOOK (0-2s): \"Nobody talks about " + offer + "...\"\n\nBUILD (2-8s): Show what makes " + offer + " different. " + tone + " energy.\n\nPAYOFF (8-15s): Reveal the value — why viewers need to check it out now.\n\nCTA: \"" + goalCTA + "\""},
    {title:format + " — Option B", content:"HOOK (0-2s): \"POV: You just found out about " + offer + "\"\n\nBUILD (2-8s): Show the before — missing out. Build curiosity.\n\nPAYOFF (8-15s): The moment they see what " + offer + " offers. Genuine reaction.\n\nCTA: \"" + goalCTA + "\""},
    {title:format + " — Option C", content:"HOOK (0-2s): \"3 things about " + offer + " that will blow your mind\"\n\nPOINT 1 (2-5s): What makes it unique\n\nPOINT 2 (5-8s): Why " + offer + " is different from everything else\n\nPOINT 3 (8-12s): The result that speaks for itself\n\nCTA: \"" + goalCTA + "\""},
  ];

  return {
    scripts: scripts,
    hooks: [
      "Nobody's talking about " + offer + "...",
      "POV: You just discovered " + offer,
      "Stop scrolling — you need to see " + offer,
      "I wish I knew about " + offer + " sooner",
      "This is why everyone's joining " + offer,
    ],
    captions: [
      "This changed everything \u{1f631} #" + brand.replace(/\s/g,"") + " #viral #fyp",
      "Save this for later \u{1f516} #" + brand.replace(/\s/g,"") + " #gamechanger",
      "Tag someone who needs to see this \u{1f447} #" + brand.replace(/\s/g,"") + " #fyp",
    ],
    adCopy: isPaid ? "HEADLINE: " + offer + " — See What You're Missing\n\nPRIMARY TEXT: " + offer + " is giving people exclusive access like never before.\n\n\u{2713} Real results\n\u{2713} Trusted platform\n\u{2713} Join thousands\n\nCTA: " + goalCTA : "",
    shotList: isImage ?
      "IMAGE COMPOSITION for " + offer + "\n\n\u{1f5bc}️ LAYOUT\nClean, eye-catching composition\nBold headline text at top or center\nBrand prominent but not cluttered\n\n\u{1f3a8} STYLE\n" + tone + " vibe\nHigh contrast for scroll-stopping impact\n\n\u{1f4dd} TEXT\nKeep to 5-8 words max on image\nCTA directing viewer to " + goalCTA + "\n\n\u{1f4f0} SPECS\n1080x1080 for feed\n1080x1920 for stories"
      : "SHOT LIST for " + offer + "\n\n\u{1f3ac} SHOT 1 — HOOK (0-2s)\nGrab attention immediately\n\n\u{1f3ac} SHOT 2 — BUILD (2-5s)\nShow what makes " + offer + " special\n\n\u{1f3ac} SHOT 3 — REVEAL (5-10s)\nShow the value viewers get\n\n\u{1f3ac} SHOT 4 — CTA (10-15s)\n" + goalCTA,
  };
}

          },
            h("div",{style:{fontSize:22,marginBottom:4}},f.icon),
            h("div",{style:{fontSize:13,fontWeight:600,color:format===f.label?"#e2e8f0":"#94a3b8"}},f.label),
            h("div",{style:{fontSize:11,color:"#64748b",marginTop:2}},f.desc)
          );
        })
      ),

      h(Section,{icon:"\u{1f3a3}",title:"Hook Style",sub:"How do you grab attention?"}),
      h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
        HOOKS.map(function(hk){
          return h(TapCard,{key:hk.label,label:hk.label,desc:hk.desc,icon:hk.icon,active:hookStyle===hk.label,color:"#3b82f6",onClick:function(){setHookStyle(hk.label);}});
        })
      ),

      h(Section,{icon:"\u{1f3a4}",title:"Tone & Vibe",sub:"What energy?"}),
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:8}},
        TONES.map(function(t){
          return h(TapPill,{key:t.label,label:t.label,icon:t.icon,active:tone===t.label,onClick:function(){setTone(t.label);}});
        })
      ),

      h(NextBtn,{onClick:function(){setStep(4);doGenerate();},label:apiKey?"Generate with AI \u{1f916}":"Generate Content",disabled:!format||!hookStyle||!tone,color:STEP_LABELS[4].color})
    );
  };

  // ─── STEP 4: GENERATE ─────────────────────────────────

  var Step4 = function() {
    if(loading) {
      return h("div",{style:{textAlign:"center",padding:"60px 0"}},
        h(LoadingDots),
        h("p",{style:{color:"#8b5cf6",fontSize:16,fontWeight:600,marginTop:16}}, apiKey ? "\u{1f916} AI is writing your content..." : "\u{2699}️ Generating templates..."),
        h("p",{style:{color:"#64748b",fontSize:13,marginTop:8}}, "This takes a few seconds")
      );
    }
    if(!aiResult) {
      return h("div",{style:{textAlign:"center",padding:"60px 0"}},
        h("p",{style:{color:"#94a3b8"}}, "Something went wrong."),
        h("button",{onClick:doGenerate,style:{marginTop:16,padding:"12px 24px",borderRadius:12,border:"none",background:"#8b5cf6",color:"#fff",fontSize:15,fontWeight:600,cursor:"pointer"}}, "Try Again")
      );
    }

    var siteName = (WEBSITES.find(function(w){return w.id===website;})||{}).label||"";
    var featureName = feature ? (MODELBID_FEATURES.find(function(f){return f.id===feature;})||{}).label||"" : "";
    var displayName = featureName ? featureName + " on " + siteName : siteName;
    return h("div",{className:"fade-in"},
      h("h2",{style:{fontSize:24,fontWeight:800,color:"#e2e8f0",margin:"0 0 6px"}}, "\u{1f916} Your Content"),
      h("p",{style:{color:"#64748b",fontSize:14,margin:"0 0 8px"}}, displayName + " • " + (contentType==="paid"?"Paid Ad":"Organic") + " • " + (mediaType==="picture"?"Picture":"Video")),

      aiError && h(Card,{glow:"#f59e0b",style:{marginBottom:16}},
        h("p",{style:{color:"#fbbf24",fontSize:13,margin:0}}, "⚠️ " + aiError)
      ),
      !apiKey && h(Card,{glow:"#6366f1",style:{marginBottom:16}},
        h("p",{style:{color:"#a5b4fc",fontSize:13,margin:0}}, "\u{1f4a1} Add an OpenAI API key in Settings for way better AI-generated content.")
      ),

      h(Section,{icon:"\u{1f4c4}",title:"Pick a Script",sub:"Tap your favorite"}),
      aiResult.scripts && aiResult.scripts.map(function(s,i){
        var picked = pickedScript === i;
        return h("button",{key:i,onClick:function(){setPickedScript(i);},
          style:{width:"100%",textAlign:"left",cursor:"pointer",marginBottom:12,background:picked?"#22c55e10":"#0f172a",border:picked?"2px solid #22c55e":"2px solid #1e293b",borderRadius:16,padding:16,transition:"all 0.2s"}
        },
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},
            h("span",{style:{fontSize:15,fontWeight:700,color:picked?"#86efac":"#e2e8f0"}}, s.title || ("Option " + (i+1))),
            picked && h("span",{style:{background:"#14532d",color:"#86efac",padding:"4px 12px",borderRadius:99,fontSize:12,fontWeight:700}}, "✓ Selected")
          ),
          h("pre",{style:{fontSize:13,color:"#94a3b8",whiteSpace:"pre-wrap",lineHeight:1.6,margin:0,fontFamily:"inherit"}}, s.content)
        );
      }),

      h("div",{style:{display:"flex",flexWrap:"wrap",gap:8,marginTop:8}},
        ["\u{1f504} Regenerate","\u{1f525} Make Edgier","\u{1f602} Add Humor","\u{2702}️ Make Shorter"].map(function(label){
          return h("button",{key:label,onClick:function(){if(label.indexOf("Regenerate")!==-1){doGenerate();}},style:{padding:"10px 16px",borderRadius:99,border:"1px solid #334155",background:"transparent",color:"#94a3b8",fontSize:13,cursor:"pointer",fontWeight:500}},label);
        })
      ),

      h(NextBtn,{onClick:function(){saveProject();setStep(5);},label:"Save & Get Content Pack",color:STEP_LABELS[5].color})
    );
  };

  // ─── STEP 5: CONTENT PACK ─────────────────────────────

  var Step5 = function() {
    if(!aiResult) return h("div",null,"No content generated.");
    var script = aiResult.scripts && aiResult.scripts[pickedScript] ? aiResult.scripts[pickedScript].content : "";
    var hooks = aiResult.hooks || [];
    var captions = aiResult.captions || [];
    var adCopy = aiResult.adCopy || "";
    var shotList = aiResult.shotList || "";
    var siteName = (WEBSITES.find(function(w){return w.id===website;})||{}).label||"";

    return h("div",{className:"fade-in"},
      h("h2",{style:{fontSize:24,fontWeight:800,color:"#e2e8f0",margin:"0 0 6px"}}, "\u{1f381} Your Content Pack"),
      h("p",{style:{color:"#64748b",fontSize:14,margin:"0 0 28px"}}, "Everything's ready. Just copy and go!"),

      h(Card,{glow:"#22c55e"},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          h("div",null,
            h("span",{style:{fontSize:15,fontWeight:700,color:"#86efac"}}, "✓ Ready to Go!"),
            h("p",{style:{fontSize:12,color:"#64748b",margin:"4px 0 0"}}, siteName + " • " + platform + " • " + (mediaType==="picture"?"Picture":"Video"))
          ),
          h("span",{style:{fontSize:28}}, "\u{1f680}")
        )
      ),

      h(Card,{style:{marginTop:8}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
          h("span",{style:{fontSize:15,fontWeight:700,color:"#e2e8f0"}}, "\u{1f4c4} Your Script"),
          h(CopyBtn,{text:script})
        ),
        h("pre",{style:{background:"#020617",padding:14,borderRadius:10,fontSize:13,color:"#94a3b8",overflow:"auto",maxHeight:200,margin:0,whiteSpace:"pre-wrap",lineHeight:1.5}}, script)
      ),

      h(Card,{style:{marginTop:8}},
        h("span",{style:{fontSize:15,fontWeight:700,color:"#e2e8f0",display:"block",marginBottom:10}}, "\u{1f3a3} Hook Variations"),
        hooks.map(function(hk,i){
          return h("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<hooks.length-1?"1px solid #1e293b":"none"}},
            h("span",{style:{fontSize:14,color:"#e2e8f0",flex:1,marginRight:8}}, (i+1)+". "+hk),
            h(CopyBtn,{text:hk})
          );
        })
      ),

      h(Card,{style:{marginTop:8}},
        h("span",{style:{fontSize:15,fontWeight:700,color:"#e2e8f0",display:"block",marginBottom:10}}, "\u{1f4ac} Captions"),
        captions.map(function(c,i){
          return h("div",{key:i,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:i<captions.length-1?"1px solid #1e293b":"none"}},
            h("span",{style:{fontSize:14,color:"#e2e8f0",flex:1,marginRight:8}}, c),
            h(CopyBtn,{text:c})
          );
        })
      ),

      adCopy && h(Card,{style:{marginTop:8},glow:"#f59e0b"},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
          h("span",{style:{fontSize:15,fontWeight:700,color:"#fbbf24"}}, "\u{1f4b0} Ad Copy"),
          h(CopyBtn,{text:adCopy})
        ),
        h("pre",{style:{background:"#020617",padding:14,borderRadius:10,fontSize:13,color:"#94a3b8",overflow:"auto",maxHeight:160,margin:0,whiteSpace:"pre-wrap",lineHeight:1.5}}, adCopy)
      ),

      shotList && h(Card,{style:{marginTop:8}},
        h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
          h("span",{style:{fontSize:15,fontWeight:700,color:"#e2e8f0"}}, mediaType==="picture"?"\u{1f5bc}️ Image Guide":"\u{1f3ac} Shot List"),
          h(CopyBtn,{text:shotList})
        ),
        h("pre",{style:{background:"#020617",padding:14,borderRadius:10,fontSize:13,color:"#94a3b8",overflow:"auto",maxHeight:160,margin:0,whiteSpace:"pre-wrap",lineHeight:1.5}}, shotList)
      ),

      h("div",{style:{display:"flex",gap:10,marginTop:32}},
        h("button",{onClick:function(){setView("home");setTab("create");},
          style:{flex:1,padding:"16px",borderRadius:14,border:"2px solid #334155",background:"transparent",color:"#94a3b8",fontSize:15,fontWeight:700,cursor:"pointer"}
        }, "← Home"),
        h("button",{onClick:resetWizard,
          style:{flex:2,padding:"16px",borderRadius:14,border:"none",fontSize:15,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,#8b5cf6,#6366f1)",color:"#fff",boxShadow:"0 4px 20px #8b5cf640"}
        }, "+ Make Another")
      )
    );
  };

  // ─── WIZARD WRAPPER ───────────────────────────────────

  var WizardScreen = function() {
    var screens = [Step0, Step1, Step2, Step3, Step4, Step5];
    return h("div",{style:{maxWidth:540,margin:"0 auto",padding:"16px 20px 100px"}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}},
        h("button",{onClick:function(){if(step===0)setView("home");else setStep(step-1);},
          style:{background:"none",border:"none",color:"#94a3b8",fontSize:15,cursor:"pointer",padding:"6px 0",fontWeight:600}
        }, "← " + (step===0?"Home":"Back"))
      ),
      h(ProgressBar,{step:step}),
      screens[step]()
    );
  };

  // ─── HOME SCREEN ──────────────────────────────────────

  var HomeScreen = function() {
    return h("div",{style:{padding:24,maxWidth:480,margin:"0 auto"}},
      h("div",{style:{textAlign:"center",padding:"48px 0 36px"}},
        h("div",{style:{fontSize:52,marginBottom:16}}, "⚡"),
        h("h1",{style:{fontSize:28,fontWeight:900,color:"#e2e8f0",margin:0,lineHeight:1.2}},
          "Viral Content", h("br"), "Operating System"
        ),
        h("p",{style:{color:"#64748b",fontSize:15,marginTop:10}}, "Tap. Pick. Generate. Post.")
      ),

      h("button",{onClick:resetWizard,
        style:{width:"100%",padding:"20px",borderRadius:18,border:"none",fontSize:18,fontWeight:800,cursor:"pointer",background:"linear-gradient(135deg,#8b5cf6,#6366f1)",color:"#fff",boxShadow:"0 4px 24px #8b5cf640",transition:"all 0.2s"}
      }, "+ New Content"),

      h("div",{style:{marginTop:32,display:"flex",flexDirection:"column",gap:10}},
        [
          {icon:"\u{1f4c1}",label:"Saved Projects",count:projects.length,action:function(){setTab("projects");setView("projects");}},
          {icon:"\u{1f4dd}",label:"Info Bank",count:"",action:function(){setTab("infobank");setView("infobank");}},
          {icon:"\u{1f4ca}",label:"IG Analytics",count:"Soon",action:function(){setTab("analytics");setView("analytics");}},
          {icon:"\u{2699}️",label:"Settings",count:"",action:function(){setTab("settings");setView("settings");}},
        ].map(function(item,i){
          return h("button",{key:i,onClick:item.action,
            style:{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"16px 18px",background:"#0f172a",border:"1.5px solid #1e293b",borderRadius:14,color:"#e2e8f0",fontSize:15,cursor:"pointer",textAlign:"left",fontWeight:500}
          },
            h("span",{style:{display:"flex",alignItems:"center",gap:12}},
              h("span",{style:{fontSize:22}},item.icon), " "+item.label
            ),
            item.count !== "" && h("span",{style:{background:"#1e293b",padding:"4px 12px",borderRadius:99,fontSize:13,color:"#94a3b8",fontWeight:600}},item.count)
          );
        })
      )
    );
  };

  // ─── INFO BANK ────────────────────────────────────────

  var InfoBankScreen = function() {
    return h("div",{style:{maxWidth:540,margin:"0 auto",padding:"16px 20px 100px"}},
      h("h2",{style:{fontSize:24,fontWeight:800,color:"#e2e8f0",margin:"0 0 6px"}}, "\u{1f4dd} Info Bank"),
      h("p",{style:{color:"#64748b",fontSize:14,margin:"0 0 24px"}}, "Add notes, competitor examples, brand guidelines, or anything that helps generate better content. This info gets fed to the AI when you create content for that website."),

      WEBSITES.map(function(w){
        var isEditing = editingInfo === w.id;
        var currentInfo = infoBank[w.id] || "";
        return h(Card,{key:w.id,glow:isEditing?w.color:undefined,style:{marginBottom:12}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:isEditing?12:0}},
            h("div",{style:{display:"flex",alignItems:"center",gap:10}},
              h("span",{style:{fontSize:24}},w.icon),
              h("div",null,
                h("div",{style:{fontSize:15,fontWeight:700,color:"#e2e8f0"}},w.label),
                h("div",{style:{fontSize:12,color:"#64748b"}},w.url)
              )
            ),
            h("button",{onClick:function(){setEditingInfo(isEditing?"":w.id);},
              style:{background:isEditing?"#14532d":"#1e293b",border:"none",borderRadius:10,padding:"6px 14px",color:isEditing?"#86efac":"#94a3b8",fontSize:13,cursor:"pointer",fontWeight:600}
            }, isEditing?"Done":currentInfo?"\u{270f}️ Edit":"\u{2795} Add Info")
          ),
          !isEditing && currentInfo && h("p",{style:{fontSize:13,color:"#94a3b8",marginTop:10,lineHeight:1.5,whiteSpace:"pre-wrap"}}, currentInfo.length > 150 ? currentInfo.substring(0,150)+"..." : currentInfo),
          isEditing && h("textarea",{
            value:currentInfo,
            onChange:function(e){var newBank=Object.assign({},infoBank);newBank[w.id]=e.target.value;setInfoBank(newBank);},
            placeholder:"Paste competitor examples, brand guidelines, audience insights, unique selling points, past winning content ideas...",
            style:{width:"100%",minHeight:120,padding:"14px 16px",background:"#020617",border:"2px solid "+w.color,borderRadius:14,color:"#e2e8f0",fontSize:14,outline:"none",fontFamily:"inherit",boxSizing:"border-box",resize:"vertical",lineHeight:1.5}
          })
        );
      })
    );
  };

  // ─── IG ANALYTICS (PLACEHOLDER) ───────────────────────

  var AnalyticsScreen = function() {
    return h("div",{style:{maxWidth:540,margin:"0 auto",padding:"16px 20px 100px",textAlign:"center"}},
      h("div",{style:{padding:"60px 0"}},
        h("div",{style:{fontSize:64,marginBottom:16}},"\u{1f4ca}"),
        h("h2",{style:{fontSize:24,fontWeight:800,color:"#e2e8f0",margin:"0 0 12px"}}, "Instagram Analytics"),
        h("p",{style:{color:"#64748b",fontSize:15,maxWidth:320,margin:"0 auto",lineHeight:1.6}}, "Coming soon. This will connect to your Instagram to analyze what's working, track engagement, and give you data-driven content suggestions."),
        h("div",{style:{marginTop:32,padding:"16px 24px",background:"#0f172a",border:"2px solid #1e293b",borderRadius:16,display:"inline-block"}},
          h("span",{style:{color:"#94a3b8",fontSize:14,fontWeight:600}}, "\u{1f6a7} Under Development")
        )
      )
    );
  };

  // ─── SETTINGS ─────────────────────────────────────────

  var SettingsScreen = function() {
    return h("div",{style:{maxWidth:540,margin:"0 auto",padding:"16px 20px 100px"}},
      h("h2",{style:{fontSize:24,fontWeight:800,color:"#e2e8f0",margin:"0 0 24px"}}, "\u{2699}️ Settings"),

      h(Card,null,
        h("div",{style:{marginBottom:16}},
          h("label",{style:{display:"block",fontSize:14,color:"#e2e8f0",marginBottom:6,fontWeight:600}}, "\u{1f511} OpenAI API Key"),
          h("p",{style:{fontSize:12,color:"#64748b",margin:"0 0 8px"}}, "Add this to unlock AI-powered content. Get one at platform.openai.com"),
          h("input",{
            value:apiKey,
            onChange:function(e){setApiKey(e.target.value);},
            placeholder:"sk-...",
            type:"password",
            style:{width:"100%",padding:"14px 16px",background:"#020617",border:"2px solid #1e293b",borderRadius:14,color:"#e2e8f0",fontSize:15,outline:"none",fontFamily:"monospace",boxSizing:"border-box"}
          })
        ),
        apiKey ? h("div",{style:{padding:"8px 12px",background:"#14532d",borderRadius:10,color:"#86efac",fontSize:13,fontWeight:500}}, "✓ API key saved — AI generation is ON")
               : h("div",{style:{padding:"8px 12px",background:"#1e293b",borderRadius:10,color:"#94a3b8",fontSize:13}}, "No key — using template generation (still works, just less creative)")
      ),

      h(Card,{style:{marginTop:12}},
        h("div",{style:{fontSize:14,color:"#e2e8f0",fontWeight:600,marginBottom:12}}, "\u{1f310} Your Websites"),
        WEBSITES.map(function(w,i){
          return h("div",{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderBottom:i<WEBSITES.length-1?"1px solid #1e293b":"none"}},
            h("span",{style:{fontSize:20}},w.icon),
            h("div",{style:{flex:1}},
              h("div",{style:{color:"#e2e8f0",fontSize:14,fontWeight:600}},w.label),
              h("div",{style:{color:"#64748b",fontSize:12}},w.url)
            )
          );
        })
      ),

      h(Card,{style:{marginTop:12}},
        h("button",{onClick:function(){if(confirm("Delete all saved projects?")){setProjects([]);}},
          style:{width:"100%",padding:"12px",borderRadius:10,border:"1px solid #7f1d1d",background:"transparent",color:"#fca5a5",fontSize:14,cursor:"pointer",fontWeight:600}
        }, "\u{1f5d1}️ Clear All Projects")
      )
    );
  };

  // ─── PROJECTS ─────────────────────────────────────────

  var ProjectsScreen = function() {
    return h("div",{style:{maxWidth:540,margin:"0 auto",padding:"16px 20px 100px"}},
      h("h2",{style:{fontSize:24,fontWeight:800,color:"#e2e8f0",margin:"0 0 6px"}}, "\u{1f4c1} Saved Projects"),
      h("p",{style:{color:"#64748b",fontSize:14,margin:"0 0 24px"}}, projects.length + " project" + (projects.length!==1?"s":"") + " saved"),

      projects.length === 0 ?
        h(Card,{style:{textAlign:"center",padding:48}},
          h("span",{style:{fontSize:40,display:"block",marginBottom:12}}, "\u{1f4c2}"),
          h("p",{style:{color:"#64748b",fontSize:15,marginBottom:16}}, "No saved projects yet."),
          h("button",{onClick:resetWizard,
            style:{padding:"14px 28px",borderRadius:14,border:"none",fontSize:15,fontWeight:700,cursor:"pointer",background:"linear-gradient(135deg,#8b5cf6,#6366f1)",color:"#fff"}
          }, "+ Make Your First One")
        )
      : projects.map(function(p,i){
          var site = WEBSITES.find(function(w){return w.id===p.website;});
          return h(Card,{key:i},
            h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
              h("div",null,
                h("h3",{style:{margin:0,fontSize:16,fontWeight:700,color:"#e2e8f0"}}, p.name),
                h("p",{style:{margin:"4px 0 0",fontSize:13,color:"#64748b"}}, p.platform + " · " + (p.mediaType==="picture"?"Picture":"Video") + " · " + p.date)
              ),
              h("span",{style:{fontSize:22}}, site?site.icon:"\u{1f4c4}")
            )
          );
        })
    );
  };

  // ─── BOTTOM NAV ───────────────────────────────────────

  var BottomNav = function() {
    var items = [
      {id:"create",icon:"⚡",label:"Create"},
      {id:"infobank",icon:"\u{1f4dd}",label:"Info Bank"},
      {id:"projects",icon:"\u{1f4c1}",label:"Projects"},
      {id:"settings",icon:"\u{2699}️",label:"Settings"},
    ];
    return h("div",{
      style:{position:"fixed",bottom:0,left:0,right:0,background:"#0f172aee",borderTop:"1px solid #1e293b",display:"flex",justifyContent:"space-around",padding:"10px 0 14px",zIndex:100,backdropFilter:"blur(10px)"}
    },
      items.map(function(item){
        var active = tab === item.id;
        return h("button",{key:item.id,onClick:function(){setTab(item.id);setView(item.id==="create"?"home":item.id);},
          style:{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",padding:"4px 12px",color:active?"#8b5cf6":"#64748b",fontSize:11,fontWeight:active?700:500,transition:"all 0.2s"}
        },
          h("span",{style:{fontSize:20,transition:"transform 0.2s",transform:active?"scale(1.15)":"scale(1)"}}, item.icon),
          item.label
        );
      })
    );
  };

  // ─── RENDER ───────────────────────────────────────────

  var renderView = function() {
    if(view === "wizard") return WizardScreen();
    if(view === "settings") return SettingsScreen();
    if(view === "projects") return ProjectsScreen();
    if(view === "infobank") return InfoBankScreen();
    if(view === "analytics") return AnalyticsScreen();
    return HomeScreen();
  };

  return h("div",{style:{minHeight:"100vh",background:"#020617",color:"#e2e8f0",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}},
    renderView(),
    BottomNav()
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(React.StrictMode, null, h(App)));
</script></body></html>
